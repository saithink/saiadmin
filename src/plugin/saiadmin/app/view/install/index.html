<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用安装向导</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        [v-cloak] {
            display: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
        }

        .install-header {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .install-header img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
        }

        .install-header h1 {
            font-size: 20px;
            color: #303133;
            margin: 0;
        }

        .install-container {
            background: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .step-title {
            font-size: 18px;
            color: #303133;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .log-container {
            background: #f5f7fa;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin-top: 20px;
        }

        .log-item {
            padding: 12px;
            background: white;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid #409eff;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-icon {
            color: #409eff;
            font-size: 16px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .log-content {
            flex: 1;
            min-width: 0;
            display: block;
        }

        .log-text {
            color: #303133;
            font-size: 14px;
            margin-bottom: 4px;
            word-wrap: break-word;
            display: block;
            line-height: 1.5;
        }

        .log-time {
            color: #909399;
            font-size: 12px;
            display: block;
            line-height: 1.5;
        }

        .completed-message {
            text-align: center;
            padding: 40px 20px;
        }

        .completed-icon {
            font-size: 60px;
            color: #67c23a;
            margin-bottom: 20px;
        }

        .completed-title {
            font-size: 24px;
            color: #303133;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .completed-subtitle {
            font-size: 14px;
            color: #606266;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <!-- Header -->
        <div class="install-header">
            <img src="https://saithink.top/images/logo.png" alt="Logo">
            <h1>【{{app}}-{{version}}】安装配置向导</h1>
        </div>

        <!-- Main Container -->
        <div class="install-container">
            {{currentStep}}
            <!-- Steps -->
            <el-steps :active="currentStep - 1" finish-status="success" simple style="margin-bottom: 30px;">
                <el-step title="数据库配置" icon="Coin"></el-step>
                <el-step title="执行安装" icon="Setting"></el-step>
                <el-step title="安装完成" icon="CircleCheck"></el-step>
            </el-steps>

            <!-- Step 1: Database Config -->
            <div v-show="currentStep === 1">
                <h2 class="step-title">数据库配置</h2>
                <el-form :model="dbConfig" label-width="100px" label-position="top">
                    <el-row :gutter="20">
                        <el-col :span="24">
                            <el-form-item label="数据库数据">
                                <el-radio-group v-model="dbConfig.dataType">
                                    <el-radio label="demo">附带演示数据</el-radio>
                                    <el-radio label="pure">纯净数据</el-radio>
                                </el-radio-group>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="数据库主机" required>
                                <el-input v-model="dbConfig.host" placeholder="请输入数据库主机">
                                    <template #prefix>
                                        <i class="fas fa-server"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="端口" required>
                                <el-input v-model.number="dbConfig.port" type="number" placeholder="请输入端口">
                                    <template #prefix>
                                        <i class="fas fa-plug"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="数据库名" required>
                                <el-input v-model="dbConfig.database" placeholder="请输入数据库名">
                                    <template #prefix>
                                        <i class="fas fa-database"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="用户名" required>
                                <el-input v-model="dbConfig.username" placeholder="请输入用户名">
                                    <template #prefix>
                                        <i class="fas fa-user"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="密码" required>
                                <el-input v-model="dbConfig.password" type="password" placeholder="请输入密码" show-password>
                                    <template #prefix>
                                        <i class="fas fa-key"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                        <el-col :span="12">
                            <el-form-item label="表前缀">
                                <el-input v-model="dbConfig.prefix" placeholder="请输入表前缀（可选）">
                                    <template #prefix>
                                        <i class="fas fa-table"></i>
                                    </template>
                                </el-input>
                            </el-form-item>
                        </el-col>
                    </el-row>
                    <div class="button-group">
                        <el-button type="primary" @click="handleNextStep" :loading="loading">
                            下一步
                        </el-button>
                    </div>
                </el-form>
            </div>

            <!-- Step 2: Installation Process -->
            <div v-show="currentStep === 2">
                <h2 class="step-title">执行安装</h2>
                <el-progress :percentage="installProgress" :stroke-width="20" striped striped-flow></el-progress>
                <div class="log-container" ref="logContainer">
                    <div v-for="(log, index) in installLogs" :key="index" class="log-item">
                        <div class="log-icon">
                            <i :class="log.icon"></i>
                        </div>
                        <div class="log-content">
                            <div class="log-text">[[ log.text ]]</div>
                            <div class="log-time">[[ log.time ]]</div>
                        </div>
                    </div>
                    <div v-if="installLogs.length === 0" style="text-align: center; color: #909399; padding: 20px;">
                        暂无日志
                    </div>
                </div>
            </div>

            <!-- Step 3: Installation Complete -->
            <div v-show="currentStep === 3">
                <div class="completed-message">
                    <div class="completed-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="completed-title">安装成功</h2>
                    <p class="completed-subtitle">恭喜！已成功安装系统，请重启webman，启动前端项目进行访问。</p>
                    <el-button type="primary" size="large" @click="goToDashboard">
                        进入管理后台
                    </el-button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3.3.11/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios@1.6.2/dist/axios.min.js"></script>
    
    <script>
        const { createApp, ref, computed, nextTick } = Vue;
        const { ElMessage } = ElementPlus;

        const app = createApp({
            delimiters: ['[[', ']]'],  // 修改分隔符避免与 Twig 冲突
            setup() {
                const message = ref('Hello vue!')
                const currentStep = ref(1);
                const loading = ref(false);
                const installProgress = ref(0);
                const logContainer = ref(null);

                const dbConfig = ref({
                    host: '127.0.0.1',
                    port: 3306,
                    database: '',
                    username: '',
                    password: '',
                    prefix: '',
                    dataType: 'demo'
                });

                const installLogs = ref([]);

                const validateDbConfig = () => {
                    const required = ['host', 'database', 'username', 'password'];
                    for (const field of required) {
                        if (!dbConfig.value[field]) {
                            ElMessage.error('请填写所有必填字段');
                            return false;
                        }
                    }
                    return true;
                };

                const addLog = (icon, text) => {
                    const now = new Date();
                    const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                                     now.getMinutes().toString().padStart(2, '0') + ':' + 
                                     now.getSeconds().toString().padStart(2, '0');
                    
                    installLogs.value.push({
                        icon: `fas fa-${icon}`,
                        text: text,
                        time: timeString
                    });

                    nextTick(() => {
                        if (logContainer.value) {
                            logContainer.value.scrollTop = logContainer.value.scrollHeight;
                        }
                    });
                };

                const runInstallSteps = () => {
                    const steps = [
                        { icon: 'database', text: '正在创建数据库表...' },
                        { icon: 'file-import', text: '正在导入基础数据...' },
                        { icon: 'cogs', text: '正在配置系统参数...' },
                        { icon: 'tachometer-alt', text: '正在优化系统性能...' }
                    ];

                    let stepIndex = 0;

                    const runStep = () => {
                        if (stepIndex < steps.length) {
                            const step = steps[stepIndex];
                            addLog(step.icon, step.text);
                            
                            installProgress.value = ((stepIndex + 1) / steps.length) * 100;

                            setTimeout(() => {
                                stepIndex++;
                                runStep();
                            }, 1000);
                        } else {
                            setTimeout(() => {
                                currentStep.value = 3;
                            }, 500);
                        }
                    };
                    runStep();
                };
                
                const handleNextStep = async () => {
                    if (!validateDbConfig()) {
                        return;
                    }

                    loading.value = true;

                    try {
                        const response = await axios.post('/core/install/install', dbConfig.value);
                        
                        if (response.data.code === 200) {
                            // 清空日志并添加初始日志
                            installLogs.value.push({ 
                                icon: 'fas fa-info-circle', 
                                text: '准备开始安装...', 
                                time: '刚刚' 
                            });
                            
                            currentStep.value = 2;
                            
                            // 等待 DOM 更新后再执行安装步骤
                            nextTick(() => {
                                runInstallSteps();
                            });
                        } else {
                            ElMessage.error('数据库连接失败：' + response.data.message);
                        }
                    } catch (error) {
                        ElMessage.error('请求失败，请检查网络连接');
                    } finally {
                        loading.value = false;
                    }
                };

                const goToDashboard = () => {
                    window.location.href = 'http://localhost:3006';
                };

                return {
                    message,
                    currentStep,
                    loading,
                    installProgress,
                    dbConfig,
                    installLogs,
                    logContainer,
                    handleNextStep,
                    goToDashboard
                };
            }
        });

        // 注册 Element Plus Icons
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
