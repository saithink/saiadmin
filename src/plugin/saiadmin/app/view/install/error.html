<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安装错误</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
        }

        .install-header {
            background: white;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .install-header img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
        }

        .install-header h1 {
            font-size: 20px;
            color: #303133;
            margin: 0;
        }

        .install-container {
            background: white;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .error-message {
            text-align: center;
            padding: 40px 20px;
        }

        .error-icon {
            font-size: 80px;
            color: #f56c6c;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-title {
            font-size: 24px;
            color: #303133;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-content {
            font-size: 14px;
            color: #606266;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-detail {
            background: #fef0f0;
            border: 1px solid #fde2e2;
            border-radius: 4px;
            padding: 15px;
            margin: 20px 0 30px;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-detail-title {
            font-size: 14px;
            color: #f56c6c;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-detail-text {
            font-size: 13px;
            color: #606266;
            line-height: 1.6;
            word-break: break-word;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .install-header {
                padding: 15px;
            }

            .install-header h1 {
                font-size: 16px;
            }

            .install-header img {
                width: 40px;
                height: 40px;
            }

            .install-container {
                padding: 20px;
            }

            .error-icon {
                font-size: 60px;
            }

            .error-title {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .el-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <div class="install-header">
            <img src="https://saithink.top/images/logo.png" alt="Logo">
            <h1>【{{app}}-{{version}}】安装配置向导</h1>
        </div>

        <!-- Main Container -->
        <div class="install-container">
            <div class="error-message">
                <div class="error-icon">
                    <i class="fas fa-times-circle"></i>
                </div>
                <h2 class="error-title">安装失败</h2>
                <p class="error-content">很抱歉，安装过程中遇到了问题，请检查错误信息后重试。</p>
                
                <div class="error-detail">
                    <div class="error-detail-title">
                        <i class="fas fa-exclamation-triangle"></i>
                        错误详情
                    </div>
                    <div class="error-detail-text">{{error}}</div>
                </div>

                <div class="button-group">
                    <el-button type="primary" size="large" @click="goToInstall">
                        <i class="fas fa-redo"></i>&nbsp;&nbsp;重新安装
                    </el-button>
                    <el-button size="large" @click="goToHome">
                        <i class="fas fa-home"></i>&nbsp;&nbsp;返回首页
                    </el-button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3.3.11/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
    
    <script>
        const { createApp } = Vue;

        const app = createApp({
            setup() {
                const goToInstall = () => {
                    window.location.href = '/core/install';
                };

                const goToHome = () => {
                    window.location.href = '/';
                };

                return {
                    goToInstall,
                    goToHome
                };
            }
        });

        // 注册 Element Plus Icons
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
